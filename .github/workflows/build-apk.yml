name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: "recursive"

      - name: Pakai kunci tanda tangan tetap (supaya update bisa menimpa versi sebelumnya)
        run: |
          mkdir -p ~/.android
          if [ -f ci-debug.keystore ]; then
            cp ci-debug.keystore ~/.android/debug.keystore
            echo "Memakai ci-debug.keystore"
          else
            echo "ci-debug.keystore tidak ada; memakai kunci acak"
          fi

      - name: Placeholder google-services.json
        run: |
          mkdir -p app
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "org.levimc.launcher"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyCIOnlyPlaceholderKey"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Licenses
        run: yes | sdkmanager --licenses

      - name: Install Build Tools 35.0.0
        run: sdkmanager "build-tools;35.0.0"

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "2.9.9"
          actions-cache-folder: ".xmake-cache"
          actions-cache-key: "ubuntulinux-ci"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Grant Execute Permission to gradlew
        run: chmod +x ./gradlew

      - name: Empty API key
        run: echo "curseforge.api_key=" >> local.properties

      # Kalau langkah upload mapping Crashlytics gagal (tanpa akun Firebase asli),
      # APK-nya biasanya sudah jadi. Karena itu langkah ini boleh gagal.
      - name: Build Debug APK
        continue-on-error: true
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: LeviLauncher-combo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
